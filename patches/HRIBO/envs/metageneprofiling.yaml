# Replacement for HRIBO/envs/metageneprofiling.yaml (HRIBO 1.8.1).
#
# HRIBO leaves every package unpinned. In September 2026 conda resolved this
# environment to the free-threaded build of Python 3.14, plotly 7 and
# python-kaleido 1.3. Two of HRIBO's scripts then failed: pysam's extension
# is not built for free-threaded Python and read_length_statistics.py
# crashed with a segmentation fault, and Kaleido 1.x needs a separately
# installed Chrome to write SVG files, so metagene_profiling.py stopped at
# the first plot. Pinning Python below 3.13 and Kaleido to 0.2.1, which
# bundles its own renderer and works with plotly 5, fixes both. See
# docs/troubleshooting.md.
channels:
 - conda-forge
 - bioconda
dependencies:
 - python>=3.10,<3.13
 - numpy
 - pysam
 - pandas>=2,<3
 - interlap
 - plotly>=5,<6
 - xlsxwriter
 - openpyxl
 - python-kaleido=0.2.1
